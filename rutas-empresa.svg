<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
<title id="title">Tres rutas para empresas</title><desc id="desc">Prevenir, corregir y defender: trabajos distintos con alcance acordado.</desc>
<rect width="720" height="450" rx="12" fill="#112238"/><path d="M40 72H680" stroke="#dbc17a" stroke-width="2"/>
<g font-family="Arial,sans-serif"><text x="40" y="49" fill="#dbc17a" font-size="16" letter-spacing="2">ALVARADO &amp; ASOCIADOS</text>
<text x="40" y="115" fill="#f4f2ec" font-size="27">Una necesidad. La ruta pertinente.</text>
<g fill="#0a1628" stroke="#dbc17a" stroke-opacity=".5"><rect x="40" y="155" width="640" height="68" rx="6"/><rect x="40" y="239" width="640" height="68" rx="6"/><rect x="40" y="323" width="640" height="68" rx="6"/></g>
<g fill="#dbc17a" font-size="19" font-weight="bold"><text x="62" y="197">PREVENIR</text><text x="62" y="281">CORREGIR</text><text x="62" y="365">DEFENDER</text></g>
<g fill="#f4f2ec" font-size="19"><text x="225" y="197">Obligaciones, controles y brechas</text><text x="225" y="281">Medidas y seguimiento acordados</text><text x="225" y="365">Análisis de vías y representación</text></g>
<text x="40" y="426" fill="#bcc5cf" font-size="15">Alcance definido · Consulta y ejecución separadas · Sin garantías de resultado</text></g></svg>
